# Render Blueprint — FRNC
# 프랜차이즈 창업 전 10초 리스크 체크 (웹 UI + JSON API + MCP)
#
# 배포
#   1) 저장소를 Render 에 연결하고 Blueprint(render.yaml)를 선택
#   2) 배포 후 https://<서비스>.onrender.com/healthz 확인
#   3) 공공데이터포털 가맹정보 API 인증키(DATA_GO_KR_SERVICE_KEY)를 환경변수로 넣으면
#      브랜드 조회가 실시간 API 로 동작합니다(색인은 이미지에 포함 — 없어도 조회됨).
#   4) 브랜드 색인 갱신은 .github/workflows/sync-brands-index.yml 이 주 1회 커밋합니다.
#
# 주의
#   - 서버는 인증키 없이도 동작합니다(판정은 법령 조문만으로 계산, 브랜드 조회는 내장 색인).
#   - free 플랜은 영구 디스크가 없어 카운터·문의가 재배포 시 초기화됩니다.
#   - free 플랜 미접속 시 슬립되므로 첫 요청이 30~60초 걸릴 수 있습니다.
services:
  - type: web
    name: frnc
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://frnc.onrender.com
      - key: FRNC_DB
        value: /app/data/app.sqlite
      - key: DATA_GO_KR_SERVICE_KEY
        sync: false
      # 요청 제한(선택) — 비워 두면 기본 240/분 · 문의 30/분
      - key: FRNC_RATE_LIMIT_PER_MINUTE
        sync: false
      - key: FRNC_RATE_WRITE_PER_MINUTE
        sync: false
      # 문의 알림·조회(선택) — 무료 플랜은 재시작 때 DB 가 초기화됩니다.
      # 영구 디스크를 붙이면 FRNC_INQUIRY_MIRROR=/var/data/inquiries.jsonl 도 함께 두세요.
      - key: FRNC_INQUIRY_WEBHOOK_URL
        sync: false
      - key: FRNC_ADMIN_TOKEN
        sync: false

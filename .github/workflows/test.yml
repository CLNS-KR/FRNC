name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (no API key needed)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s src/tests -t src/tests -v
      - name: Smoke run server
        env:
          PYTHONPATH: src
          PORT: "8787"
        run: |
          python -m franchise_kr.server &
          for i in $(seq 1 20); do
            if python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=2)"; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json, urllib.error, urllib.request
          def get(path):
              try:
                  with urllib.request.urlopen(f"http://127.0.0.1:8787{path}", timeout=5) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
          status, _ = get("/healthz")
          assert status == 200
          request = urllib.request.Request(
              "http://127.0.0.1:8787/mcp",
              data=json.dumps({"jsonrpc": "2.0", "id": 1, "method": "tools/list"}).encode(),
              headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=5) as response:
              assert len(json.loads(response.read())["result"]["tools"]) == 7
          scan = urllib.request.Request(
              "http://127.0.0.1:8787/v1/tools/scan_contract_text",
              data=json.dumps({"text": "가맹금과 보증금은 당사 계좌로 직접 입금한다."}).encode(),
              headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(scan, timeout=5) as response:
              body = json.loads(response.read())
          assert body["ok"] is True
          assert body["result"]["verdict"]["code"] == "scan_flagged", body["result"]["verdict"]
          assert body["result"]["not_a_clearance_ko"], "0건 안내 문장 누락"
          assert body["result"]["meta"]["version"] == "0.1.7", body["result"]["meta"]["version"]
          assert "가맹금 본사 직접 수령" in json.dumps(body, ensure_ascii=False)
          status, body = get("/guides/")
          assert status == 200
          status, body = get("/guides/cooling-off-14days")
          assert status == 200 and b"FAQPage" in body
          status, sitemap = get("/sitemap.xml")
          assert status == 200 and b"/guides/" in sitemap
          status, llms = get("/llms.txt")
          assert status == 200 and b"FRNC" in llms
          # 브랜드 색인 회귀 — 이름 검색 파라미터가 없는 API 를 전체 페이지로 훑어 만든 색인으로
          # 유명 브랜드가 실제로 찾히는지 확인한다(인증키 없이도 동작해야 한다).
          lookup = urllib.request.Request(
              "http://127.0.0.1:8787/v1/tools/lookup_brand_disclosure",
              data=json.dumps({"brand_name": "BBQ"}).encode(),
              headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(lookup, timeout=20) as response:
              brand = json.loads(response.read())["result"]
          assert brand["status"] == "live", brand["status"]
          assert brand["data_source"] == "index", brand["data_source"]
          assert brand["brands"] and "BBQ" in brand["brands"][0]["brand_name"].upper()
          # 색인에 가맹점 및 직영점(15125490) 합계가 들어 있어 인증키 없이도 숫자가 나온다.
          first = brand["brands"][0]
          assert first["stores_year_end"] == 2316, first.get("stores_year_end")
          assert first["direct_stores"] == 71, first.get("direct_stores")
          # 비어 있는 필드는 이유와 함께 돌아온다(설명 ↔ 응답 정렬).
          assert brand["field_status"]["null"], brand["field_status"]
          assert any(item["field"] == "avg_sales_krw" for item in brand["field_status"]["null"])
          # 관리자 토큰이 없으면 문의 조회 경로는 없는 것으로 답한다.
          assert get("/v1/inquiries")[0] == 404
          # 없는 주소는 사람용 HTML, /v1/ 은 JSON.
          assert get("/no-such-page")[0] == 404
          print("smoke ok")
          PY
